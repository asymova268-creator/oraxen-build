name: Build Oraxen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Клонируем репозиторий
      - uses: actions/checkout@v3

      # Устанавливаем Java 17
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Показываем версию Java для проверки
      - name: Check Java version
        run: java -version

      # Собираем плагин через Gradle
      - name: Build Oraxen
        run: ./gradlew build --no-daemon

      # Проверяем, какие файлы создал Gradle
      - name: Check build output
        run: ls -l build/libs

      # Загружаем все JAR из build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: oraxen-jar
          path: build/libs/*.jar
