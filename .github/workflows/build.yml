name: Build Oraxen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin

    - run: ./gradlew build

    - uses: actions/upload-artifact@v3
      with:
        name: oraxen-jar
        path: build/libs/*.jar
